<!DOCTYPE html>
<html>
<head>
    <title>AI Scam Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1f4037, #99f2c8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 500px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 20px;
            background: #1f4037;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #14532d;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        .message-box {
            margin-top: 15px;
            background: #f4f4f4;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Scam & Phishing Detector 🔍</h2>

    <form action="/predict" method="post">
    <textarea id="messageBox" name="message" rows="4" placeholder="Enter message here..."></textarea>
    <br><br>
    <button type="submit">Check Message</button>
    <button type="button" onclick="clearForm()">Clear</button>
</form>

    {% if result %}
        <div class="result">{{ result }}</div>
    {% endif %}
    {% if confidence %}
    <p><b>Scam Probability:</b> {{ confidence }}%</p>
{% endif %}

{% if risk %}
    <p><b>Risk Level:</b> {{ risk }}</p>
{% endif %}
<div class="result">{{ result }}</div>

    {% if highlighted_message %}
        <div class="message-box">
            {{ highlighted_message | safe }}
        </div>
    {% endif %}
</div>
<script>
function clearForm() {
    document.getElementById("messageBox").value = "";
    document.querySelector(".result")?.remove();
    document.querySelectorAll("p").forEach(p => {
        if (p.innerText.includes("Scam Probability") || 
            p.innerText.includes("Risk Level")) {
            p.remove();
        }
    });
    document.querySelector(".message-box")?.remove();
}
</script>

</body>
</html>
